appId: com.helstera.desktop
productName: Helstera
copyright: Copyright © 2025 Helstera

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Graphics

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Helstera

publish:
  provider: generic
  url: https://releases.helstera.com
