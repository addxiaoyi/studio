appId: com.helstera.desktop
productName: Helstera
copyright: Copyright © 2025 Helstera
beforePack: scripts/check-video-before-pack.cjs
afterPack: scripts/verify-package.cjs
compression: maximum
electronLanguages: [en-US, zh-CN, zh-TW]

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron/*.js
  # Node OCR loads .js + .wasm; the embedded browser builds duplicate the core.
  - "!node_modules/tesseract.js-core/*.wasm.js"
  - "!node_modules/tesseract.js/dist/**"
  - "!node_modules/tesseract.js/docs/**"
  - "!node_modules/**/pngjs/browser.js"
  - "!node_modules/zlibjs/bin/*.dev*"
  - "!node_modules/jimp/browser/**"
  - "!node_modules/**/*.map"
  - "!node_modules/zlibjs/bin/{browser,gunzip,gzip,inflate,rawdeflate,rawinflate,unzip,zip,zlib}*"

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources
    to: .
    filter: [startup.html, startup.css, startup.js, setup.html, setup.css, setup.js, snapshots.html, snapshots.css, snapshots.js, thumbnail.html, thumbnail.js, snapshot-media.js, snapshot-storage.js, snapshot-batch.js, snapshot-merge.js]
  - from: node_modules/react/LICENSE
    to: licenses/react.txt
  - from: node_modules/react-dom/LICENSE
    to: licenses/react-dom.txt

asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**

npmRebuild: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  files:
    - dist
    - dist-electron/*.js
    - "!node_modules/@nut-tree/libnut-{darwin,linux}/**"
  extraResources:
    - from: resources/native/helstera-uia.exe
      to: native/helstera-uia.exe
    - from: resources/ffmpeg/win-x64
      to: ffmpeg/win-x64
      filter:
        - ffmpeg.exe
        - ffprobe.exe
        - LICENSE.txt
        - SOURCE.txt
        - ffmpeg-source.tar.xz
        - x264-source.tar.xz
        - ffmpeg-config.mak
        - x264-config.mak
        - SHA256SUMS
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: "${productName}-Setup-${version}-Windows-x64.${ext}"
  oneClick: false
  # Solid compression cuts the full installer; updates verify and download the full package.
  differentialPackage: false
  perMachine: false
  allowElevation: true
  installerLanguages: [zh_CN, en_US]
  language: "2052"
  include: resources/installer.nsh
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Helstera

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

portable:
  artifactName: "${productName}-${version}-Windows-x64-portable.${ext}"

protocols:
  - name: Helstera Desktop Login
    schemes:
      - helstera

mac:
  files:
    - dist
    - dist-electron/*.js
    - "!node_modules/@nut-tree/libnut-{win32,linux}/**"
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  files:
    - dist
    - dist-electron/*.js
    - "!node_modules/@nut-tree/libnut-{win32,darwin}/**"
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Graphics

publish:
  provider: generic
  url: https://studio.0st.top/downloads/updates/
