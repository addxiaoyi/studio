appId: com.helstera.desktop
productName: Helstera
copyright: Copyright © 2025 Helstera

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron

extraResources:
  - from: resources/icon.png
    to: icon.png

npmRebuild: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  artifactName: "${productName}-Setup-${version}-Windows-x64.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Helstera

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

protocols:
  - name: Helstera Desktop Login
    schemes:
      - helstera

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Graphics

publish:
  provider: generic
  url: https://studio.0st.top/downloads/updates/
