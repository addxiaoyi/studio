appId: com.helstera.desktop
productName: Helstera
copyright: Copyright © 2025 Helstera
beforePack: scripts/check-video-before-pack.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist
  - dist-electron

extraResources:
  - from: resources/icon.png
    to: icon.png

asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**

npmRebuild: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  extraResources:
    - from: resources/native/helstera-uia.exe
      to: native/helstera-uia.exe
    - from: resources/ffmpeg/win-x64
      to: ffmpeg/win-x64
      filter:
        - ffmpeg.exe
        - ffprobe.exe
        - LICENSE.txt
        - SOURCE.txt
        - ffmpeg-source.tar
        - x264-source.tar
        - ffmpeg-config.mak
        - x264-config.mak
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: "${productName}-Setup-${version}-Windows-x64.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Helstera

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

portable:
  artifactName: "${productName}-${version}-Windows-x64-portable.${ext}"

protocols:
  - name: Helstera Desktop Login
    schemes:
      - helstera

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Graphics

publish:
  provider: generic
  url: https://studio.0st.top/downloads/updates/
