<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: helstera-media:; media-src helstera-media:"><title>Helstera · 本地快照</title><link rel="stylesheet" href="snapshots.css"></head>
<body><header><strong>Helstera</strong><nav><button id="connect">联网打开工作台</button><button id="minimize" aria-label="最小化">−</button><button id="close" aria-label="关闭窗口">×</button></nav></header>
<main><div class="intro"><p>本地工作区</p><h1>快照与创作记录</h1><p>无需联网即可预览画布和对话。待恢复任务留在本机，联网登录原账户后再确认恢复。</p></div>
<section class="toolbar"><label>本地账户<select id="account"></select></label><label>查找工程<input id="search" type="search" placeholder="工程名或文件名"></label><button id="refresh">刷新列表</button><button id="folder">打开工作区</button></section>
<p id="disk" role="status"></p><button id="manage">按工程管理本地空间</button><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><div class="workspace"><section id="list" aria-label="本地快照列表"></section><section id="preview" aria-label="快照预览" hidden><h2 id="name"></h2><img id="thumbnail" alt="本地画布结构预览"><label>与同工程版本比较<select id="baseline"></select></label><p id="diff"></p><button id="queue">加入待恢复列表</button><p id="queued" role="status"></p><h3>本地图片与视频</h3><p>点击素材后在本机校验并预览，不上传文件。</p><div id="media-list"></div><div id="media-preview" aria-live="polite"></div><h3>画布文字</h3><div id="texts"></div><h3>历史对话</h3><div id="messages"></div></section></div></main><dialog id="cleanup-dialog" aria-labelledby="cleanup-title"><h2 id="cleanup-title">清理本地工程</h2><p>删除所选工程的本地快照与专属素材；保留其他工程共用的素材。云端内容不变。</p><div id="cleanup-list"></div><section id="cleanup-plan" hidden><p id="cleanup-summary"></p><details><summary>查看文件清单</summary><ul id="cleanup-files"></ul></details><label class="confirm-row"><input id="cleanup-accept" type="checkbox">我确认永久删除清单中的本地文件，删除后无法从本机恢复。</label><button id="cleanup-confirm" disabled>确认清理本地文件</button></section><p id="cleanup-status" role="status"></p><button id="cleanup-close">返回快照库</button></dialog><script src="snapshots.js"></script></body></html>
