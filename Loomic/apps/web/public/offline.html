<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helstera - 离线模式</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: oklch(0.985 0.003 260);
      color: oklch(0.18 0.015 260);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: oklch(1 0 0 / 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid oklch(1 0 0 / 0.45);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 12px 40px -8px oklch(0.18 0.02 260 / 0.12);
    }
    .icon-box {
      display: inline-flex;
      padding: 20px;
      background: oklch(1 0 0 / 0.4);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid oklch(1 0 0 / 0.3);
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .icon { width: 28px; height: 28px; stroke: oklch(0.62 0.12 245); stroke-width: 1.25; fill: none; }
    h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { font-size: 14px; font-weight: 300; line-height: 1.7; color: oklch(0.52 0.015 260); margin: 0 0 32px; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 200ms ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn-primary { background: oklch(0.18 0.015 260); color: oklch(0.99 0 0); }
    .btn-primary:hover { transform: scale(1.02); }
    .btn-secondary { background: oklch(1 0 0 / 0.4); color: oklch(0.18 0.015 260); border: 1px solid oklch(0.92 0.005 260); }
    .btn-secondary:hover { background: oklch(1 0 0 / 0.55); }
    .status {
      margin-top: 20px;
      padding: 8px 12px;
      background: oklch(0.62 0.12 150 / 0.1);
      color: oklch(0.42 0.10 150);
      border-radius: 8px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon-box">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>您处于离线状态</h1>
    <p>Helstera 需要网络连接才能加载最新内容。请检查您的网络后重试。</p>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        重新加载
      </button>
      <button class="btn btn-secondary" onclick="window.history.back()">
        返回上一页
      </button>
    </div>
    <div>
      <span class="status">
        <span style="width:6px;height:6px;background:currentColor;border-radius:50%;display:inline-block"></span>
        等待网络连接
      </span>
    </div>
  </main>
  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
