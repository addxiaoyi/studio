<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1726"/>
      <stop offset="50%" stop-color="#0f0d18"/>
      <stop offset="100%" stop-color="#1a1726"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8d144" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3d3866" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f0d18" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="380" fill="url(#glow)"/>

  <!-- Subtle dot grid (very faint) -->
  <g fill="#ffffff" fill-opacity="0.04">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="160" cy="80" r="2"/>
    <circle cx="240" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/>
    <circle cx="160" cy="160" r="2"/>
    <circle cx="80" cy="240" r="2"/>
    <circle cx="960" cy="80" r="2"/>
    <circle cx="1040" cy="80" r="2"/>
    <circle cx="1120" cy="80" r="2"/>
    <circle cx="1040" cy="160" r="2"/>
    <circle cx="1120" cy="160" r="2"/>
    <circle cx="1120" cy="240" r="2"/>
  </g>

  <!-- Center: wordmark -->
  <g transform="translate(600 280)">
    <!-- Logo mark — abstract H glyph -->
    <g transform="translate(-180 -120)">
      <rect x="0" y="0" width="36" height="120" rx="6" fill="#fbfaf8"/>
      <rect x="64" y="0" width="36" height="120" rx="6" fill="#fbfaf8"/>
      <rect x="32" y="50" width="36" height="20" rx="4" fill="#a8d144"/>
    </g>
    <!-- Wordmark -->
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
      font-size="96"
      font-weight="600"
      letter-spacing="-3"
      fill="#fbfaf8"
    >Helstera</text>

    <!-- Tagline -->
    <text
      x="0"
      y="60"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
      font-size="22"
      font-weight="300"
      letter-spacing="6"
      fill="#a8d144"
    >ENTERPRISE AI CANVAS</text>
  </g>

  <!-- Bottom strip — features -->
  <g transform="translate(0 540)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" fill="#fbfaf8" fill-opacity="0.65">
    <text x="120" y="0">品牌一致性</text>
    <text x="320" y="0">实时协作</text>
    <text x="520" y="0">企业安全合规</text>
    <text x="720" y="0">15+ AI 模型</text>
    <text x="900" y="0">SOC 2 / GDPR</text>
    <text x="1080" y="0">私有化部署</text>
  </g>

  <!-- Bottom-right: domain -->
  <g transform="translate(1080 580)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
    <text
      x="0"
      y="0"
      text-anchor="end"
      font-size="14"
      fill="#fbfaf8"
      fill-opacity="0.4"
      letter-spacing="2"
    >helstera.com</text>
  </g>
</svg>
