name: Desktop Candidate CI

on:
  push:
    branches: [master, main, 'codex/**']
    paths: ['Loomic/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['Loomic/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:
    inputs:
      native_only:
        description: "Verify macOS and Linux native packages without rebuilding Windows video tools"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  video-tools:
    if: ${{ !inputs.native_only }}
    name: Windows video tools
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm pkg-config make xz-utils
      - name: Build pinned FFmpeg and x264
        run: bash Loomic/scripts/build-windows-video-tools.sh "$RUNNER_TEMP/video-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-video-tools
          path: ${{ runner.temp }}/video-tools/
          if-no-files-found: error
          retention-days: 7
  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: video-tools
    if: ${{ always() && (needs.video-tools.result == 'success' || (inputs.native_only && needs.video-tools.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native_only && '[{"platform":"macos-arm64","os":"macos-15","args":"--mac dmg --arm64"},{"platform":"linux-x64","os":"ubuntu-24.04","args":"--linux AppImage --x64"}]' || '[{"platform":"windows-x64","os":"windows-2022","args":"--win nsis --x64"},{"platform":"macos-arm64","os":"macos-15","args":"--mac dmg --arm64"},{"platform":"linux-x64","os":"ubuntu-24.04","args":"--linux AppImage --x64"}]') }}
    defaults:
      run:
        working-directory: Loomic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-tools-${{ matrix.platform }}-${{ hashFiles('Loomic/pnpm-lock.yaml') }}
          restore-keys: desktop-tools-${{ matrix.platform }}-
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Build shared contracts
        run: pnpm --filter @helstera/shared build
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-video-tools
          path: Loomic/apps/desktop/resources/ffmpeg/win-x64
      - name: Verify video tool resources
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/check-video-resources.mjs
      - name: Typecheck and test desktop
        run: |
          pnpm --filter @helstera/desktop typecheck
          node --test apps/desktop/scripts/verify-video-resources.test.mjs
          pnpm --filter @helstera/desktop test
          pnpm --filter @helstera/desktop exec vitest run --config vitest.config.ts electron/extension-sync.test.ts
      - name: Build native helper
        run: pnpm --filter @helstera/desktop build:native
      - name: Sandbox preload and renderer recovery (Windows and macOS)
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/run-renderer-health.mjs
      - name: Sandbox preload and renderer recovery (Linux)
        if: runner.os == 'Linux'
        run: |
          electron_sandbox=$(node -e 'const {createRequire}=require("node:module"); const {dirname,join}=require("node:path"); process.stdout.write(join(dirname(createRequire(process.cwd()+"/apps/desktop/package.json")("electron")),"chrome-sandbox"))')
          test -f "$electron_sandbox" && test ! -L "$electron_sandbox"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
          xvfb-run -a node apps/desktop/scripts/run-renderer-health.mjs
      - name: Disable macOS signing auto-discovery
        if: runner.os == 'macOS'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: Build candidate package
        shell: bash
        run: |
          pnpm --filter @helstera/desktop exec tsc -p tsconfig.electron.json
          pnpm --filter @helstera/desktop exec vite build
          for attempt in 1 2 3; do
            pnpm --filter @helstera/desktop exec electron-builder ${{ matrix.args }} --publish never && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Packaged Windows startup, recovery and window lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HELT_DESKTOP_EXE = Join-Path $PWD 'apps/desktop/release/win-unpacked/Helstera.exe'
          $env:HELT_DESKTOP_LIFECYCLE_DIR = Join-Path $env:RUNNER_TEMP 'desktop-lifecycle'
          node apps/desktop/e2e/lifecycle.mjs
          $env:HELT_STORAGE_TEST_DIR = Join-Path $env:RUNNER_TEMP 'desktop-local-storage'
          node apps/desktop/e2e/local-storage.mjs
      - name: Upload Windows lifecycle evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lifecycle-windows
          path: |
            ${{ runner.temp }}/desktop-lifecycle/report.json
            ${{ runner.temp }}/desktop-lifecycle/offline.png
            ${{ runner.temp }}/desktop-local-storage/report.json
            ${{ runner.temp }}/desktop-local-storage/setup-200-percent.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Installed macOS package workspace and restore
        if: runner.os == 'macOS'
        env:
          HELT_NATIVE_PACKAGE_TEST_DIR: ${{ runner.temp }}/desktop-native
        run: node apps/desktop/e2e/package-storage.mjs
      - name: Extracted Linux AppImage workspace and restore
        if: runner.os == 'Linux'
        env:
          HELT_NATIVE_PACKAGE_TEST_DIR: ${{ runner.temp }}/desktop-native
        run: xvfb-run -a node apps/desktop/e2e/package-storage.mjs
      - name: Upload native workspace evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-storage-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/desktop-native/storage/report.json
            ${{ runner.temp }}/desktop-native/storage/setup-200-percent.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ matrix.platform }}
          path: |
            Loomic/apps/desktop/release/*.exe
            Loomic/apps/desktop/release/*.dmg
            Loomic/apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7
