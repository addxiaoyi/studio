name: Agent Closure CI
on:
  workflow_dispatch:
    inputs:
      workflow_only:
        description: "Run the real canvas/workflow browser regressions"
        type: boolean
        default: false
  push:
    branches: [main, master, 'codex/**']
    paths: ['Loomic/apps/**', 'Loomic/packages/**', 'Loomic/scripts/**', 'Loomic/pnpm-lock.yaml', '.github/workflows/agent-closure-ci.yml']
  pull_request:
    paths: ['Loomic/**', '.github/workflows/agent-closure-ci.yml']
permissions:
  contents: read
jobs:
  contracts-and-database:
    if: ${{ !inputs.workflow_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Loomic
    env:
      HELT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loomic_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helstera/shared build
      - name: Four package type checks
        run: |
          pnpm --filter @helstera/shared typecheck
          pnpm --filter @helstera/server typecheck
          pnpm --filter @helstera/web typecheck
          pnpm --filter @helstera/desktop typecheck
      - name: Approval, recovery and private asset database gates
        run: |
          psql "$HELT_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;'
          node scripts/test-local-postgres.mjs src/features/agent-goals/goal-steps.postgres.test.ts src/runtime/media-admission.postgres.test.ts src/features/projects/project-context.postgres.test.ts src/features/projects/video-document.postgres.test.ts src/features/assets/private-lifecycle.postgres.test.ts src/local-db/private-upload-ownership.postgres.test.ts src/local-db/viewer-locks.postgres.test.ts src/features/onetake/onetake.postgres.test.ts src/features/video-editor/plan-store.postgres.test.ts
          pnpm --filter @helstera/web exec vitest run test/project-context.test.tsx test/project-video-sync.test.ts test/media-file-hash.test.ts test/canvas-video-import-state.test.tsx test/studio-project-key.test.ts test/select-pointer.test.tsx test/styled-select.test.tsx test/snapshot-thumbnail-ready.test.ts
      - name: Readiness, graceful drain and release retention
        run: |
          pnpm --filter @helstera/server exec vitest run src/http/health.test.ts src/queue/local-job-queue.test.ts src/runtime/queue-runner.test.ts src/runtime/periodic-tasks.test.ts src/runtime/drain-gate.test.ts src/features/agent-goals/worker-drain.test.ts
          python3 -m unittest scripts/test_switch_server_upstream.py
          sudo python3 -m unittest scripts/test_storage_retention.py
      - name: Preserve production authentication, project identity and public media
        run: |
          node scripts/test-local-postgres.mjs src/http/local-auth-register.postgres.test.ts src/local-db/project-idempotency.postgres.test.ts
          pnpm --filter @helstera/server exec vitest run src/http/public-media.test.ts src/local-db/chat-service.test.ts src/local-db/project-service.test.ts src/features/website-capture/assistant-recording-claim.test.ts
          pnpm --filter @helstera/web exec vitest run test/register.test.tsx test/login.test.tsx test/local-auth-network-error.test.ts
      - name: Structured model planning deadlines
        run: pnpm --filter @helstera/server exec vitest run src/features/agent-goals/goal-planner.test.ts src/features/agent-goals/goal-plan-timeout.test.ts src/features/video-editor/planner.test.ts
      - name: Private Agent browser access and controls
        run: |
          node scripts/test-local-postgres.mjs src/features/agent-browser/browser-view.postgres.test.ts src/features/agent-browser/engine.test.ts src/features/agent-browser/observer.test.ts
          pnpm --filter @helstera/web exec vitest run test/agent-browser-dock.test.tsx test/agent-browser-poll.test.ts test/canvas-bottom-bar.test.tsx
      - name: Private playback and saved workspace recovery
        run: |
          pnpm --filter @helstera/server exec vitest run src/http/media-access.test.ts src/http/local-assets.test.ts
          node scripts/test-local-postgres.mjs src/http/private-video.postgres.test.ts
          pnpm --filter @helstera/web exec vitest run test/authenticated-recording.test.tsx test/fashion-retention.test.tsx test/feed-page.test.tsx
      - name: Website presentation parameters and recording approval
        run: |
          pnpm --filter @helstera/server exec playwright install --with-deps chromium
          pnpm --filter @helstera/shared exec vitest run src/website-presentation.test.ts src/website-login.test.ts src/website-journey.test.ts
          node scripts/test-local-postgres.mjs src/features/website-capture/recording-approval.postgres.test.ts src/features/video-editor/narration.postgres.test.ts src/features/website-capture/recording-approval.test.ts src/http/website-capture-create.test.ts src/http/website-recording-approval.test.ts
          node scripts/test-local-postgres.mjs src/features/website-capture/canvas-delivery.postgres.test.ts
          pnpm --filter @helstera/server exec vitest run src/features/website-capture/recording-progress.test.ts src/features/website-capture/canvas-delivery.test.ts
          pnpm --filter @helstera/web exec vitest run test/capture-canvas-actions.test.tsx test/canvas-video-actions.test.tsx test/website-capture-recording.test.tsx test/canvas-timeline-panel.test.tsx test/capture-recording-import.test.tsx
      - name: Visual workflow contracts and execution journal
        run: |
          pnpm --filter @helstera/shared exec vitest run src/canvas-workflow.test.ts src/workflow-editor.test.ts src/workflow-logic.test.ts src/workflow-routing.test.ts src/creative-workflow.test.ts src/creative-library.test.ts src/canvas-document.test.ts
          node scripts/test-local-postgres.mjs src/features/canvas-workflows/service.postgres.test.ts
          pnpm --filter @helstera/server exec vitest run src/features/canvas-workflows/execution-access.test.ts src/features/canvas-workflows/logic-executor.test.ts src/features/canvas-workflows/batch-executor.test.ts src/features/canvas-workflows/generation.test.ts src/features/agent-goals/agent-goal-background.test.ts src/agent/tools/index.test.ts
          pnpm --filter @helstera/web exec vitest run test/workflow-navigation.test.tsx test/workflow-node-inspector.test.tsx test/workflow-run.test.tsx test/workflow-scene.test.ts test/workflow-groups.test.ts test/workflow-references.test.tsx test/canvas-workflow-document.test.tsx test/canvas-timeline-panel.test.tsx test/agent-workflow-card.test.tsx test/canvas-save-conflict.test.tsx test/canvas-save-merge.test.ts test/canvas-recovery-copy.test.ts
      - name: Shared UI recovery and desktop navigation
        run: pnpm --filter @helstera/web exec vitest run test/ui-recovery.test.tsx test/workspace-session.test.tsx test/desktop-navigation.test.tsx test/desktop-history-ui.test.tsx test/goal-history.test.tsx test/product-label.test.ts test/assets-latest-request.test.tsx test/workbench-save.test.tsx test/styled-select.test.tsx src/components/toast.test.tsx src/components/error-boundary.test.tsx
      - name: Canvas import identity, timeline and upload recovery
        run: |
          pnpm --filter @helstera/server exec vitest run src/http/canvas-asset-source.test.ts src/http/uploads-media.test.ts
          pnpm --filter @helstera/web exec vitest run test/canvas-asset-import.test.tsx test/canvas-timeline.test.ts test/canvas-timeline-panel.test.tsx test/video-player-panel.test.tsx test/studio-project-key.test.ts test/studio-brand.test.ts test/studio-display-name.test.ts
      - name: Try-on billing and shared form regressions
        run: |
          pnpm --filter @helstera/server exec vitest run src/features/generation/fashion-billing.postgres.test.ts src/http/fashion-billing.test.ts src/http/image-models-route.test.ts src/http/generation-approvals.test.ts src/http/media-connector-gate.test.ts
          pnpm --filter @helstera/web exec vitest run test/fashion-models.test.ts test/fashion-generation.test.ts test/app-select.test.tsx test/styled-select.test.tsx test/website-assistant-settings.test.tsx test/desktop-mcp-panel.test.tsx
      - name: Video conversation contracts and model gates
        run: |
          pnpm --filter @helstera/shared exec vitest run src/video-editor-contracts.test.ts src/video-editor-chat.test.ts src/video-motion.test.ts
          pnpm --filter @helstera/server exec vitest run src/http/video-editor-chat.test.ts src/http/video-editor.test.ts src/http/video-material-approval.test.ts src/features/generation/material-approval-gate.test.ts
          pnpm --filter @helstera/web exec vitest run test/studio-conversation.test.tsx test/studio-direct-control.test.ts test/studio-material-api.test.ts test/studio-material-library.test.tsx test/studio-video-generation.test.ts
      - name: Chat copy and reconnect recovery
        run: pnpm --filter @helstera/web exec vitest run test/chat-copy.test.tsx test/chat-selection.test.tsx test/chat-input.test.tsx test/chat-sessions.test.tsx test/chat-sidebar.test.tsx test/chat-stream.test.ts
      - name: Local snapshot restore and download recovery
        run: |
          pnpm --filter @helstera/server exec vitest run src/features/projects/restore-backup.postgres.test.ts src/http/local-assets.test.ts src/http/video-upload.postgres.test.ts src/storage/copy-upload.test.ts src/http/local-copy-release.postgres.test.ts
          pnpm --filter @helstera/web exec vitest run test/desktop-project-restore.test.tsx test/desktop-storage-panel.test.tsx test/desktop-snapshot-browser.test.tsx test/desktop-restore-tasks.test.tsx test/desktop-storage-management.test.tsx test/desktop-disk-usage.test.tsx test/canvas-focus.test.ts test/canvas-video-stream.test.tsx
          node --test scripts/install-creative-deps.test.mjs
      - name: Video workspace regressions
        run: pnpm --filter @helstera/web exec vitest run test/video-locale.test.tsx test/studio-ai-context.test.tsx test/studio-ai-workflow.test.tsx test/studio-creator-menu.test.ts test/studio-ai-edit.test.ts test/studio-ai-session.test.ts test/studio-timeline-diff.test.tsx test/generated-asset-identity.test.ts test/studio-asset-picker.test.tsx test/onetake-history.test.tsx test/onetake-export-options.test.tsx test/send-video-to-chat.test.tsx test/agent-workspace-panel.test.tsx test/agent-goal-timeout.test.ts
      - name: Deployment recovery gates on Linux
        run: |
          node --test scripts/server-runtime-lock.test.mjs
          python3 -m unittest scripts.test_deploy_production_candidate scripts.test_prepare_production_candidate scripts.test_isolated_pg_rehearsal scripts.test_apply_studio_nginx scripts.test_validate_studio_nginx -q
          python3 -m unittest discover -s apps/server/src/features/onetake -p test_runner.py -v
  editor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomic_editor
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Loomic
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loomic_editor
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helstera/shared build
      - name: Prepare pinned editor source
        run: node scripts/prepare-creative-sources.mjs video
      - name: Verify durable action undo and build runtime
        run: |
          bun run scripts/test-visualforge.ts
          bun test scripts/visualforge/project-document.test.ts
          bun run scripts/build-visualforge-runtime.ts
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm --filter @helstera/web exec playwright install --with-deps chromium
      - name: Confirm, compare, undo, reload and decode export (injected model plan)
        if: ${{ !inputs.workflow_only }}
        run: pnpm --filter @helstera/web exec playwright test --config playwright.diff-undo.config.ts
      - name: Editor startup recovery, high DPI and long export cancellation
        if: ${{ !inputs.workflow_only }}
        run: pnpm --filter @helstera/web exec playwright test --config playwright.studio-health.config.ts
      - name: Prepare pinned fashion runtime
        run: |
          node scripts/prepare-creative-sources.mjs fashion
          node scripts/build-fashion-runtime.mjs
      - name: Try-on quote, result recovery and responsive menus (injected API)
        if: ${{ !inputs.workflow_only }}
        run: pnpm --filter @helstera/web exec playwright test --config playwright.fashion-billing.config.ts
      - name: Export dialog labels, narrow layout and keyboard operation
        if: ${{ !inputs.workflow_only }}
        run: pnpm --filter @helstera/web exec playwright test --config playwright.export-dialog.config.ts
      - name: Install Agent browser engine dependencies
        run: pnpm --filter @helstera/server exec playwright install --with-deps chromium
      - name: Real Agent browser preview, pause and reconnect
        if: ${{ !inputs.workflow_only }}
        run: |
          pnpm --filter @helstera/server exec vitest run src/features/agent-browser/observer.integration.test.ts
          pnpm --filter @helstera/web exec playwright test --config playwright.agent-browser.config.ts
      - name: Project view navigation, legacy drafts and second device recovery
        if: ${{ !inputs.workflow_only }}
        run: pnpm --filter @helstera/web exec playwright test --config playwright.project-context.config.ts
      - name: Website presentation recording and playback
        if: ${{ !inputs.workflow_only }}
        run: |
          pnpm --filter @helstera/server exec vitest run src/features/website-capture/presentation.integration.test.ts src/features/website-capture/recording-quality.integration.test.ts src/features/website-capture/frame-continuity.integration.test.ts src/features/website-capture/encoding-budget.integration.test.ts src/features/website-capture/sso.integration.test.ts src/features/website-capture/login-session.test.ts src/features/website-capture/login-session.integration.test.ts src/features/website-capture/login-handoff.integration.test.ts src/features/website-capture/journey-planner.test.ts src/features/website-capture/journey-navigation.integration.test.ts
          pnpm --filter @helstera/web exec playwright test --config playwright.presentation.config.ts
      - name: Visual workflow editor and real browser output
        run: |
          HELSTERA_ONETAKE_PYTHON=python3 pnpm --filter @helstera/server exec vitest run src/features/canvas-workflows/media.integration.test.ts
          pnpm --filter @helstera/web exec playwright test --config playwright.workflow.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-timeline-undo-evidence
          path: |
            Loomic/.creative-test-results/video-diff-undo.json
            Loomic/.creative-test-results/video-diff-undo/
            Loomic/.creative-test-results/studio-health.json
            Loomic/.creative-test-results/studio-health/
            Loomic/.creative-test-results/fashion-billing.json
            Loomic/.creative-test-results/fashion-billing/
            Loomic/.creative-test-results/agent-browser.json
            Loomic/.creative-test-results/agent-browser/
            Loomic/.creative-test-results/presentation/
            Loomic/.creative-test-results/presentation-flow.json
            Loomic/.creative-test-results/presentation-flow/
            Loomic/.creative-test-results/workflow/
            Loomic/.creative-test-results/workflow.json
            Loomic/.creative-test-results/project-context/
            Loomic/.creative-test-results/project-context.json
          if-no-files-found: error
          retention-days: 7
