name: Agent Closure CI
on:
  push:
    branches: [main, master, 'codex/**']
    paths: ['Loomic/apps/**', 'Loomic/packages/**', 'Loomic/scripts/**', 'Loomic/pnpm-lock.yaml', '.github/workflows/agent-closure-ci.yml']
  pull_request:
    paths: ['Loomic/**', '.github/workflows/agent-closure-ci.yml']
permissions:
  contents: read
jobs:
  contracts-and-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loomic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Loomic
    env:
      HELT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loomic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helstera/shared build
      - name: Four package type checks
        run: |
          pnpm --filter @helstera/shared typecheck
          pnpm --filter @helstera/server typecheck
          pnpm --filter @helstera/web typecheck
          pnpm --filter @helstera/desktop typecheck
      - name: Approval, recovery and private asset database gates
        run: node scripts/test-local-postgres.mjs src/features/agent-goals/goal-steps.postgres.test.ts src/features/assets/private-lifecycle.postgres.test.ts src/local-db/private-upload-ownership.postgres.test.ts src/features/onetake/onetake.postgres.test.ts src/features/video-editor/plan-store.postgres.test.ts
      - name: Video workspace regressions
        run: pnpm --filter @helstera/web exec vitest run test/video-locale.test.tsx test/generated-asset-identity.test.ts test/studio-asset-picker.test.tsx test/onetake-history.test.tsx test/onetake-export-options.test.tsx test/send-video-to-chat.test.tsx test/agent-workspace-panel.test.tsx
      - name: Deployment recovery gates on Linux
        run: python3 -m unittest scripts.test_deploy_production_candidate scripts.test_prepare_production_candidate scripts.test_isolated_pg_rehearsal scripts.test_apply_studio_nginx scripts.test_validate_studio_nginx -q
