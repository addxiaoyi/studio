name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages and manifests to studio.0st.top
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace and desktop login
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Loomic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Loomic/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts and typecheck
        run: |
          pnpm --filter @helstera/shared build
          pnpm typecheck
      - name: Test workspace
        run: |
          pnpm test
          node --test apps/browser-assistant/test/*.test.mjs
      - name: Build the static Web routes
        run: pnpm --filter @helstera/web build
      - name: Test release packaging and pinned hosts
        run: |
          python -m pip install -r scripts/requirements-desktop-release.txt
          python scripts/test_release_desktop.py
          test -s scripts/production-known-hosts

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win nsis zip --x64
            artifact: windows-x64
          - name: macOS Intel
            os: macos-14
            args: --mac dmg zip --x64
            artifact: macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            args: --mac dmg zip --arm64
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux AppImage --x64
            artifact: linux-x64
    needs: verify
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Loomic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Loomic/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @helstera/shared build
      - name: Verify desktop and browser extension
        run: |
          pnpm --filter @helstera/desktop typecheck
          pnpm --filter @helstera/desktop test
          pnpm --filter @helstera/browser-assistant test
          pnpm --filter @helstera/web exec vitest run test/desktop-login.test.tsx test/auth-callback.test.tsx test/desktop-callback-url.test.ts
      - name: Disable macOS signing auto-discovery
        if: runner.os == 'macOS'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: Build native package and updater metadata
        run: pnpm --filter @helstera/desktop exec electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            Loomic/apps/desktop/release/*.exe
            Loomic/apps/desktop/release/*.zip
            Loomic/apps/desktop/release/*.dmg
            Loomic/apps/desktop/release/*.AppImage
            Loomic/apps/desktop/release/*.blockmap
            Loomic/apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish packages and verify production routes
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-artifacts
          merge-multiple: false
      - name: Install release publisher dependencies
        run: python -m pip install -r Loomic/scripts/requirements-desktop-release.txt
      - name: Publish each platform through the pinned SSH publisher
        env:
          HELT_DEPLOY_HOST: ${{ secrets.HELT_DEPLOY_HOST }}
          HELT_DEPLOY_USER: ${{ secrets.HELT_DEPLOY_USER }}
          HELT_DEPLOY_PASSWORD: ${{ secrets.HELT_DEPLOY_PASSWORD }}
          HELT_DEPLOY_KNOWN_HOSTS: ${{ github.workspace }}/Loomic/scripts/production-known-hosts
        run: |
          set -euo pipefail
          for platform in windows-x64 macos-x64 macos-arm64 linux-x64; do
            python Loomic/scripts/release-desktop.py \
              --platform "$platform" \
              --skip-build \
              --output-dir "$GITHUB_WORKSPACE/desktop-artifacts/desktop-$platform"
          done
      - name: Verify desktop routes, callback routes, manifests, and download hashes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null https://studio.0st.top/desktop-app/
          curl --fail --silent --show-error --output /dev/null 'https://studio.0st.top/auth/desktop-confirm/?state=release-check'
          curl --fail --silent --show-error --output /dev/null 'https://studio.0st.top/auth/callback/?state=release-check'
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          version = json.load(open("Loomic/apps/desktop/package.json", encoding="utf-8"))["version"]
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref_name.startswith("desktop-v") and ref_name.removeprefix("desktop-v") != version:
              raise SystemExit(f"Tag {ref_name} does not match package version {version}")

          for platform in ("windows-x64", "macos-x64", "macos-arm64", "linux-x64"):
              manifest_url = f"https://studio.0st.top/downloads/desktop-release-{platform}.json"
              with urllib.request.urlopen(manifest_url) as response:
                  manifest = json.load(response)
              if manifest["version"] != version:
                  raise SystemExit(f"{platform} manifest has version {manifest['version']}, expected {version}")
              for key in ("fileName", "portableFileName"):
                  name = manifest.get(key)
                  checksum = manifest.get("sha256" if key == "fileName" else "portableSha256")
                  if not name:
                      continue
                  with urllib.request.urlopen(f"https://studio.0st.top/downloads/{name}") as response:
                      digest = hashlib.sha256(response.read()).hexdigest()
                  if digest.lower() != checksum.lower():
                      raise SystemExit(f"SHA-256 mismatch for {name}")
              print(f"verified {platform} {version}")
          PY
