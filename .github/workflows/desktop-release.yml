name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "同步安装包到生产服务器"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

env:
  DESKTOP_VERSION: "0.1.0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: "--win nsis"
            artifact: windows
          - name: macOS Intel
            os: macos-13
            args: "--mac dmg --x64"
            artifact: macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            args: "--mac dmg --arm64"
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-latest
            args: "--linux AppImage"
            artifact: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Loomic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @helstera/shared build
      - name: Disable macOS signing auto-discovery
        if: runner.os == 'macOS'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: Build desktop package
        run: pnpm --filter @helstera/desktop build -- ${{ matrix.args }}
      - name: Normalize installer names
        shell: bash
        run: |
          mkdir -p desktop-release
          case "${{ matrix.artifact }}" in
            windows) cp apps/desktop/release/*.exe "desktop-release/Helstera-${DESKTOP_VERSION}-Windows-x64.exe" ;;
            macos-x64) cp apps/desktop/release/*.dmg "desktop-release/Helstera-${DESKTOP_VERSION}-macOS-x64.dmg" ;;
            macos-arm64) cp apps/desktop/release/*.dmg "desktop-release/Helstera-${DESKTOP_VERSION}-macOS-arm64.dmg" ;;
            linux) cp apps/desktop/release/*.AppImage "desktop-release/Helstera-${DESKTOP_VERSION}.AppImage" ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then shasum -a 256 desktop-release/*; else sha256sum desktop-release/*; fi > desktop-release/SHA256SUMS-${{ matrix.artifact }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: Loomic/desktop-release/*
          if-no-files-found: error

  publish-server:
    name: Publish installers to studio.0st.top
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-release
          merge-multiple: true
      - name: Upload installers to production server
        env:
          HELT_DEPLOY_HOST: ${{ secrets.HELT_DEPLOY_HOST }}
          HELT_DEPLOY_USER: ${{ secrets.HELT_DEPLOY_USER }}
          SSHPASS: ${{ secrets.HELT_DEPLOY_PASSWORD }}
        run: |
          test -n "$HELT_DEPLOY_HOST"
          test -n "$HELT_DEPLOY_USER"
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e scp -o StrictHostKeyChecking=no desktop-release/* "$HELT_DEPLOY_USER@$HELT_DEPLOY_HOST:/www/helstera/apps/web/out/downloads/"
      - name: Verify public downloads
        run: |
          for asset in \
            Helstera-${DESKTOP_VERSION}.AppImage \
            Helstera-${DESKTOP_VERSION}-Windows-x64.exe \
            Helstera-${DESKTOP_VERSION}-macOS-x64.dmg \
            Helstera-${DESKTOP_VERSION}-macOS-arm64.dmg; do
            curl --fail --location --silent --show-error --head "https://studio.0st.top/downloads/$asset" | grep -i '^content-length:'
          done
